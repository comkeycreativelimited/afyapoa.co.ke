name: Automated Disaster Recovery Drill

on:
  schedule:
    # Runs at 02:00 EAT on the 1st of every month
    - cron: '0 23 1 * *'
  workflow_dispatch:

jobs:
  dr-drill:
    name: Encrypted Backup & 100% Restoration Verification Drill
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afyapoa_user
          POSTGRES_PASSWORD: afyapoa_dev_password
          POSTGRES_DB: afyapoa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afyapoa_user -d afyapoa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Baseline Database & Migrations
        env:
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Execute Full Encrypted Backup Restoration Test Suite
        env:
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
        run: |
          pnpm --filter @afyapoa/api test test/backup-restoration.spec.ts

      - name: Document DR Drill Evidence Log
        run: |
          echo "✅ [DR DRILL SUCCESS] Encrypted snapshot, tamper rejection, disaster loss, 100% restoration, and RLS re-verification verified."
