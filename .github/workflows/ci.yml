name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test, Security & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afyapoa_user
          POSTGRES_PASSWORD: afyapoa_dev_password
          POSTGRES_DB: afyapoa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afyapoa_user -d afyapoa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.2

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Environment Schema & Secrets Gate
        env:
          NODE_ENV: test
          INTEGRATION_MODE: MOCK
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-min-32-chars-long-rnd
          REFRESH_TOKEN_SECRET: ci-test-refresh-secret-min-32-chars-long
          KMS_PEPPER_SECRET: ci-test-pepper-secret-min-32-chars-long
        run: pnpm tsx infra/scripts/validate-env.ts

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f infra/docker/docker-compose.yml config
          docker compose -f infra/docker/docker-compose.staging.yml config

      - name: Run Schema Migrations
        env:
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
        run: pnpm db:migrate

      - name: Run Synthetic Seed Data
        env:
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
        run: pnpm db:seed

      - name: Typecheck Across Monorepo
        run: pnpm typecheck

      - name: Run Unit & Integration Test Suites
        env:
          DATABASE_URL: postgresql://afyapoa_user:afyapoa_dev_password@localhost:5432/afyapoa_db
          REDIS_URL: redis://localhost:6379
          INTEGRATION_MODE: MOCK
        run: pnpm test

      - name: Build Monorepo Applications & Packages
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Validate API Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: afyapoa-api:ci-test

      - name: Build and Validate Web Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: afyapoa-web:ci-test

      - name: Run Gitleaks Secrets Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
