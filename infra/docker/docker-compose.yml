services:
  postgres:
    image: postgres:16-alpine
    container_name: afyapoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-afyapoa_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-afyapoa_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-afyapoa_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-afyapoa_user} -d ${DATABASE_NAME:-afyapoa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afyapoa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
    name: afyapoa_postgres_data
  redis_data:
    name: afyapoa_redis_data
